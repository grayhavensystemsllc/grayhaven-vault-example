---
timezone: UTC

network:
  vpc_cidr: 172.22.0.0/16
  dns_resolvers:
    - 192.0.2.53
    - 198.51.100.53

swap:
  size: 1G

system_packages:
  baseline:
    - audit
    - bash-completion
    - chrony
    - curl
    - epel-release
    - fail2ban
    - firewalld
    - git
    - httpd-tools
    - NetworkManager
    - openssh-server
    - podman
    - python3
    - python3-firewall
    - python3-libselinux
    - python3-pip
    - restic
    - rsync
    - yum-utils
  admin:
    - bind-utils
    - setroubleshoot-server
    - tmux
    - vim
  web:
    - certbot
    - nginx
    - python3-certbot-dns-digitalocean
    - python3-certbot-nginx
  uninstall:
    - avahi
    - bluez
    - cups
    - nfs-utils
    - rpcbind
    - samba

system_services:
  disabled:
    - avahi-daemon
    - bluetooth
    - cups
    - nfs-server
    - rpcbind
    - smb
