---
identity:
  client_name: example
  client_domain: example.com
  organization: Example Company

project:
  name: example
  description: Example infrastructure project
  purpose: Web Application
  environment: Production
  is_default: true

defaults:
  region: ams3
  os_image: almalinux-10-x64
  droplet_size: s-1vcpu-2gb

network:
  vpcs:
    baseline_ams3:
      environment: baseline
      region: ams3
      cidr: 172.20.0.0/16
    staging_ams3:
      environment: staging
      region: ams3
      cidr: 172.21.0.0/16
    prod_ams3:
      environment: prod
      region: ams3
      cidr: 172.22.0.0/16
    baseline_fra1:
      environment: baseline
      region: fra1
      cidr: 172.23.0.0/16
    staging_fra1:
      environment: staging
      region: fra1
      cidr: 172.24.0.0/16
    prod_fra1:
      environment: prod
      region: fra1
      cidr: 172.25.0.0/16
  peerings:
    staging:
      - staging_ams3
      - staging_fra1

repositories:
  config: https://github.com/example-org/configuration.git
  vault: git@github.com:example-org/private-vault.git
